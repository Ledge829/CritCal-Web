</head>

<body>

<main id="main-content">

    <!-- ════════════════════════════════════════════ -->
    <!-- UID SEARCH                                    -->
    <!-- ════════════════════════════════════════════ -->

    <section class="hp-hero fade-up">
        <div class="hp-hero-inner">
            <div class="hp-search-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            </div>
            <div class="hp-search-main">
                <div class="hp-search-row">
                    <input type="text" id="uid-input-home" placeholder="Enter a UID to rate any showcase..." inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Player UID">
                    <button class="btn btn-primary" id="uid-search-home-btn">Search</button>
                </div>
                <div id="uid-history-home" class="hp-history"></div>
            </div>
        </div>
    </section>

    <!-- ════════════════════════════════════════════ -->
    <!-- RANDOM CHARACTER SHOWCASE                    -->
    <!-- ════════════════════════════════════════════ -->

    <section class="hp-showcase fade-up fade-up-1" id="hp-showcase">
        <div class="hp-showcase-bg" id="hp-showcase-bg"></div>
        <div class="hp-showcase-overlay"></div>
        <div class="hp-showcase-content">
            <div class="hp-showcase-info">
                <span class="eyebrow hp-showcase-label">Try a character</span>
                <h2 id="hp-char-name">Loading...</h2>
                <p class="hp-char-desc" id="hp-char-desc"></p>
                <a class="btn btn-primary" id="hp-char-link" href="#">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
                    Analyze
                </a>
            </div>
            <div class="hp-showcase-portrait" id="hp-char-portrait"></div>
        </div>
    </section>

    <!-- ════════════════════════════════════════════ -->
    <!-- QUICK ACTIONS with character portraits       -->
    <!-- ════════════════════════════════════════════ -->

    <div class="hp-actions fade-up fade-up-2" id="hp-actions"></div>

    <!-- ════════════════════════════════════════════ -->
    <!-- CHARACTER MINI GRID                          -->
    <!-- ════════════════════════════════════════════ -->

    <section class="hp-chars fade-up fade-up-3" aria-labelledby="hp-chars-heading">
        <div class="home-char-header">
            <h2 class="eyebrow" id="hp-chars-heading">Characters</h2>
            <a href="characters.html" class="home-char-view-all">View all</a>
        </div>
        <div class="home-char-pills" id="home-char-pills" role="group" aria-label="Filter by element">
            <button type="button" class="element-pill is-active" data-el="" aria-pressed="true">All</button>
            <button type="button" class="element-pill" data-el="pyro" style="--el-color:#E0785C" aria-pressed="false">Pyro</button>
            <button type="button" class="element-pill" data-el="hydro" style="--el-color:#5B9BD6" aria-pressed="false">Hydro</button>
            <button type="button" class="element-pill" data-el="anemo" style="--el-color:#6BC7AE" aria-pressed="false">Anemo</button>
            <button type="button" class="element-pill" data-el="electro" style="--el-color:#B18FE0" aria-pressed="false">Electro</button>
            <button type="button" class="element-pill" data-el="dendro" style="--el-color:#97BE58" aria-pressed="false">Dendro</button>
            <button type="button" class="element-pill" data-el="cryo" style="--el-color:#83C6DE" aria-pressed="false">Cryo</button>
            <button type="button" class="element-pill" data-el="geo" style="--el-color:#D6B96C" aria-pressed="false">Geo</button>
        </div>
        <div id="home-char-grid" class="home-char-grid"></div>
    </section>

</main>

<script src="script.js"></script>
<script src="icons.js"></script>
<script src="portraits.js"></script>
<script>
    var _allCharsData = [];

    // ── UID Search ──
    (function () {
        var input = document.getElementById("uid-input-home");
        var btn = document.getElementById("uid-search-home-btn");
        function go() {
            var uid = (input.value || "").trim();
            if (!uid) { input.focus(); return; }
            window.location.href = "uid-search.html?uid=" + encodeURIComponent(uid);
        }
        if (btn) btn.addEventListener("click", go);
        if (input) input.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
    })();

    // ── UID History ──
    (function () {
        var el = document.getElementById("uid-history-home");
        if (!el) return;
        try {
            var h = JSON.parse(localStorage.getItem("critcal_uid_history")) || [];
            if (h.length > 0) {
                el.innerHTML = '<span class="hp-history-label">Recent:</span>' + h.map(function (u) {
                    return '<span class="hp-history-pill" onclick="window.location.href=\'uid-search.html?uid=' + encodeURIComponent(u) + '\'">' + u + '</span>';
                }).join("");
            }
        } catch (_) {}
    })();

    // ── Fetch character data and build everything ──
    cachedFetch(API_BASE + "/characters", "characters").then(function (data) {
        if (!data || !data.characters) return;
        var chars = data.characters;
        _allCharsData = chars;

        // ── Random Character Showcase ──
        (function () {
            var picks = chars.filter(function (c) {
                return c.portrait && c.splash;
            });
            if (picks.length === 0) return;
            var pick = picks[Math.floor(Math.random() * picks.length)];

            document.getElementById("hp-char-name").textContent = pick.name;
            // Show a short description based on element
            var elem = (pick.element || "").toLowerCase();
            var descs = {
                pyro: "Pyro DPS or support. Strong reaction-based damage dealer.",
                hydro: "Hydro support or DPS. Enables reactions and heals.",
                anemo: "Anemo crowd control. Swirls elements and buffs the team.",
                electro: "Electro DPS or battery. Energy generation and reactions.",
                dendro: "Dendro enabler. Bloom, Quicken, and reaction damage.",
                cryo: "Cryo DPS or support. Freeze and melt enabler.",
                geo: "Geo construct DPS. DEF-scaling shields and damage.",
            };
            document.getElementById("hp-char-desc").textContent = descs[elem] || pick.roles?.join(", ") || "See their best builds and rate your own.";
            document.getElementById("hp-char-link").href = "analyze.html?character=" + encodeURIComponent(pick.name);

            var showcase = document.getElementById("hp-showcase");
            var ec = (function(e) {
                return { pyro:"#E0785C", hydro:"#5B9BD6", anemo:"#6BC7AE", electro:"#B18FE0", dendro:"#97BE58", cryo:"#83C6DE", geo:"#D6B96C" }[elem] || "#5B9BD6";
            })(elem);
            showcase.style.setProperty("--el-color", ec);

            // Portrait
            var port = document.getElementById("hp-char-portrait");
            port.innerHTML = portraitInnerHtml(pick);

            // Splash background
            var bg = document.getElementById("hp-showcase-bg");
            bg.style.backgroundImage = "url(" + pick.splash + ")";
        })();

        // ── Quick Actions with character portraits ──
        (function () {
            var container = document.getElementById("hp-actions");
            if (!container) return;

            // Pick fitting characters for each tool
            var findChar = function (keys) {
                var match = chars.find(function (c) { return keys.indexOf(c.name) !== -1; });
                if (match) return match;
                // Fallback: pick one from the element
                var byEl = chars.filter(function (c) { return keys.indexOf(c.element) !== -1; });
                return byEl.length > 0 ? byEl[Math.floor(Math.random() * byEl.length)] : chars[0];
            };

            var manualChar = findChar(["Hu Tao", "Ayaka", "Xiao", "Ganyu", "Keqing"]);
            var browseChar = findChar(["Venti", "Zhongli", "Nahida", "Kazuha", "Raiden Shogun"]);
            var statsChar = findChar(["Bennett", "Xiangling", "Xingqiu", "Fischl", "Sucrose"]);

            container.innerHTML = [
                '<a class="hp-action" href="analyze.html">',
                    '<span class="hp-action-avatar" style="--el-color:' + elementColor(manualChar.element) + '">' + portraitInnerHtml(manualChar) + '</span>',
                    '<span><strong>Manual Analyze</strong><span>Enter your own stats</span></span>',
                '</a>',
                '<a class="hp-action" href="characters.html">',
                    '<span class="hp-action-avatar" style="--el-color:' + elementColor(browseChar.element) + '">' + portraitInnerHtml(browseChar) + '</span>',
                    '<span><strong>Characters (<span id="char-count-home">' + (data.count || "120+") + '</span>)</strong><span>Browse all builds</span></span>',
                '</a>',
                '<a class="hp-action" href="uid-search.html">',
                    '<span class="hp-action-avatar" style="--el-color:' + elementColor(statsChar.element) + '">' + portraitInnerHtml(statsChar) + '</span>',
                    '<span><strong>UID Search</strong><span>Look up by UID</span></span>',
                '</a>',
            ].join("");
        })();
    });

    // ── Character Grid ──
    (function () {
        var grid = document.getElementById("home-char-grid");
        var pills = document.querySelectorAll("#home-char-pills .element-pill");
        if (!grid) return;
        var allChars = [], activeEl = "";

        function render() {
            var f = activeEl ? allChars.filter(function (c) { return c.element === activeEl; }) : allChars;
            if (!f.length) { grid.innerHTML = '<div class="home-char-loading">No characters match.</div>'; return; }
            grid.innerHTML = f.slice(0, 24).map(function (c) {
                var color = (function(e) { return { pyro:"#E0785C", hydro:"#5B9BD6", anemo:"#6BC7AE", electro:"#B18FE0", dendro:"#97BE58", cryo:"#83C6DE", geo:"#D6B96C" }[e] || "#5B9BD6"; })(c.element);
                return '<a class="home-char-tile" href="analyze.html?character=' + encodeURIComponent(c.name) + '" style="--el-color:' + color + '">' +
                    '<span class="home-char-tile-avatar" style="--el-color:' + color + '">' + portraitInnerHtml(c) + '</span>' +
                    '<span class="home-char-tile-name">' + escapeHtml(c.name) + '</span></a>';
            }).join("");
        }

        pills.forEach(function (p) {
            p.addEventListener("click", function () {
                pills.forEach(function (x) { x.classList.remove("is-active"); x.setAttribute("aria-pressed", "false"); });
                this.classList.remove("is-active");
                this.classList.add("is-active");
                this.setAttribute("aria-pressed", "true");
                activeEl = this.getAttribute("data-el") || "";
                render();
            });
        });

        cachedFetch(API_BASE + "/characters", "characters").then(function (data) {
            if (data && data.characters) { allChars = data.characters; render(); }
            else { grid.innerHTML = '<div class="home-char-loading">Could not load characters.</div>'; }
        });
    })();
</script>

</body>
</html>
