</head>

<body>

        </span>
        CritCal

    <div class="nav-profiles" id="nav-profiles"></div>

        <a href="index.html" class="active" aria-current="page">Home</a>
        <a href="characters.html">Characters</a>

        <svg class="menu-icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <svg class="menu-icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

<main id="main-content">

    <!-- ════════════════════════════════════════════ -->
    <!-- UID SEARCH                                     -->
    <!-- ════════════════════════════════════════════ -->

    <section class="hp-hero fade-up">
        <div class="hp-hero-inner">
            <div class="hp-search-icon" id="hp-search-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            </div>
            <div class="hp-search-main">
                <div class="hp-search-row">
                    <input type="text" id="uid-input-home" placeholder="Enter a UID to rate any showcase..." inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Player UID">
                    <button class="btn btn-primary" id="uid-search-home-btn">Search</button>
                </div>
            </div>
        </div>
    </section>

    <!-- ════════════════════════════════════════════ -->
    <!-- RECENT PROFILES — account bars with portraits -->
    <!-- ════════════════════════════════════════════ -->
    <!-- NEWS — latest Genshin headlines              -->
    <!-- ════════════════════════════════════════════ -->

    <section class="hp-news fade-up fade-up-1" id="hp-news">
        <div class="hp-news-header">
            <span class="eyebrow">Latest News</span>
        </div>
        <div id="hp-news-list">
            <div class="hp-news-loading">Loading news...</div>
        </div>
    </section>

    <!-- ════════════════════════════════════════════ -->
    <!-- QUICK ACTIONS with character portraits       -->
    <!-- ════════════════════════════════════════════ -->

    <div class="hp-actions fade-up fade-up-2" id="hp-actions"></div>

    <!-- ════════════════════════════════════════════ -->
    <!-- CHARACTER MINI GRID                          -->
    <!-- ════════════════════════════════════════════ -->

    <section class="hp-chars fade-up fade-up-3" aria-labelledby="hp-chars-heading">
        <div class="home-char-header">
            <h2 class="eyebrow" id="hp-chars-heading">Characters</h2>
            <a href="characters.html" class="home-char-view-all">View all</a>
        </div>
        <div class="home-char-pills" id="home-char-pills" role="group" aria-label="Filter by element">
            <button type="button" class="element-pill is-active" data-el="" aria-pressed="true">All</button>
            <button type="button" class="element-pill" data-el="pyro" style="--el-color:#E0785C" aria-pressed="false">Pyro</button>
            <button type="button" class="element-pill" data-el="hydro" style="--el-color:#5B9BD6" aria-pressed="false">Hydro</button>
            <button type="button" class="element-pill" data-el="anemo" style="--el-color:#6BC7AE" aria-pressed="false">Anemo</button>
            <button type="button" class="element-pill" data-el="electro" style="--el-color:#B18FE0" aria-pressed="false">Electro</button>
            <button type="button" class="element-pill" data-el="dendro" style="--el-color:#97BE58" aria-pressed="false">Dendro</button>
            <button type="button" class="element-pill" data-el="cryo" style="--el-color:#83C6DE" aria-pressed="false">Cryo</button>
            <button type="button" class="element-pill" data-el="geo" style="--el-color:#D6B96C" aria-pressed="false">Geo</button>
        </div>
        <div id="home-char-grid" class="home-char-grid"></div>
    </section>

</main>

<script src="script.js"></script>
<script src="icons.js"></script>
<script src="portraits.js"></script>
<script>
    var _allCharsData = [];

    // ── UID Search ──
    (function () {
        var input = document.getElementById("uid-input-home");
        var btn = document.getElementById("uid-search-home-btn");
        function go() {
            var uid = (input.value || "").trim();
            if (!uid) { input.focus(); return; }
            window.location.href = "uid-search.html?uid=" + encodeURIComponent(uid);
        }
        if (btn) btn.addEventListener("click", go);
        if (input) input.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
    })();

    // ── UID History ──
    (function () {
        var el = document.getElementById("uid-history-home");
        if (!el) return;
        try {
            var h = JSON.parse(localStorage.getItem("critcal_uid_history")) || [];
            if (h.length > 0) {
                el.innerHTML = '<span class="hp-history-label">Recent:</span>' + h.map(function (u) {
                    return '<span class="hp-history-pill" onclick="window.location.href=\'uid-search.html?uid=' + encodeURIComponent(u) + '\'">' + u + '</span>';
                }).join("");
            }
        } catch (_) {}
    })();

    // ── Fetch character data and build everything ──
    // ── UID Search icon — show Furina ──
    (function () {
        // Quick inline: show a small circle with the initial
        var si = document.getElementById("hp-search-icon");
        si.innerHTML = '<span class="hp-search-char">F</span>';
        si.style.setProperty("--el-color", "#5B9BD6");
    })();

    cachedFetch(API_BASE + "/characters", "characters").then(function (data) {
        if (!data || !data.characters) { showFallbackChar(); return; }
        var chars = data.characters;
        _allCharsData = chars;

        // ── Search icon: try loading Furina portrait ──
        (function () {
            var furina = chars.find(function (c) { return c.name === "Furina"; });
            if (furina && furina.portrait) {
                var si = document.getElementById("hp-search-icon");
                si.innerHTML = portraitInnerHtml(furina);
                si.className = "hp-search-avatar";
            }
        })();

        // ── Navbar UID Profiles (top-left) ──
        (function () {
            var container = document.getElementById("nav-profiles");
            if (!container) return;
            try {
                var uids = JSON.parse(localStorage.getItem("critcal_uid_history")) || [];
                var recent = uids.slice(0, 3);
                if (recent.length === 0) return;

                // Try to load cached portraits
                var cached;
                try { cached = JSON.parse(localStorage.getItem("critcal_uid_portraits") || "{}"); } catch(e) { cached = {}; }

                var bars = recent.map(function (uid) {
                    var img = cached[uid] || "";
                    var avatar = img ? '<img src="' + img + '" alt="">' : '<span class="nav-prof-av-letter">' + uid.charAt(0) + '</span>';
                    return '<a class="nav-prof-chip" href="uid-search.html?uid=' + encodeURIComponent(uid) + '">' +
                        '<span class="nav-prof-av">' + avatar + '</span>' +
                        '<span class="nav-prof-num">' + escapeHtml(uid) + '</span>' +
                    '</a>';
                }).join("");
                container.innerHTML = bars;

                // Fetch portraits in background for uncached UIDs
                recent.forEach(function (uid) {
                    if (cached[uid]) return;
                    fetch(API_BASE + "/uid/" + encodeURIComponent(uid) + "/showcase")
                        .then(function (r) { return r.json(); })
                        .then(function (d) {
                            if (!d || !d.characters || d.characters.length === 0) return;
                            var first = d.characters[0];
                            if (!first || !first.portrait) return;
                            cached[uid] = first.portrait;
                            try { localStorage.setItem("critcal_uid_portraits", JSON.stringify(cached)); } catch(e) {}
                            // Update the chip with the loaded portrait
                            var chip = container.querySelector('[href*="' + uid + '"]');
                            if (chip) {
                                var av = chip.querySelector(".nav-prof-av");
                                if (av) av.innerHTML = '<img src="' + first.portrait + '" alt="">';
                            }
                        })
                        .catch(function () {});
                });
            } catch (_) {}
        })();

        // ── News ──
        (function () {
            var newsEl = document.getElementById("hp-news-list");
            if (!newsEl) return;

            fetch(API_BASE + "/news", { headers: { "Accept": "application/json" } })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var items = (data && data.news) || [];
                    if (items.length === 0) {
                        newsEl.innerHTML = '<div class="hp-news-empty">No news yet.</div>';
                        return;
                    }
                    var html = '';
                    for (var ni = 0; ni < Math.min(items.length, 2); ni++) {
                        var n = items[ni];
                        html += '<div class="hp-news-item">';
                        if (n.image) {
                            html += '<div class="hp-news-img-wrap"><img class="hp-news-img" src="' + escapeHtml(n.image) + '" alt="" loading="lazy"></div>';
                        }
                        html += '<div class="hp-news-body">';
                        html += '<h3 class="hp-news-title">' + escapeHtml(n.title) + '</h3>';
                        if (n.summary) {
                            html += '<p class="hp-news-summary">' + escapeHtml(n.summary.substring(0, 120)) + '</p>';
                        }
                        if (n.url) {
                            html += '<a class="hp-news-link" href="' + escapeHtml(n.url) + '" target="_blank" rel="noopener">Read more →</a>';
                        }
                        html += '</div></div>';
                    }
                    newsEl.innerHTML = html;
                })
                .catch(function () {
                    newsEl.innerHTML = '<div class="hp-news-empty">News unavailable.</div>';
                });
        })();

        // ── Quick Actions with randomized CritCal-styled portraits ──
        (function () {
            var container = document.getElementById("hp-actions");
            if (!container) return;

            function pickChar(names) {
                // Pick a RANDOM name from the list, then find it
                var idx = Math.floor(Math.random() * names.length);
                var m = chars.find(function (c) { return c.name === names[idx]; });
                if (m) return m;
                // Fallback: try another random name
                for (var i = 0; i < 5; i++) {
                    var n = names[Math.floor(Math.random() * names.length)];
                    var f = chars.find(function (c) { return c.name === n; });
                    if (f) return f;
                }
                return chars[Math.floor(Math.random() * chars.length)];
            }

            var pool = {
                dps: ["Hu Tao", "Ayaka", "Xiao", "Ganyu", "Keqing", "Alhaitham", "Wanderer", "Diluc", "Itto", "Eula", "Cyno", "Lyney"],
                archon: ["Venti", "Zhongli", "Nahida", "Kazuha", "Raiden Shogun", "Furina", "Navia", "Mavuika", "Xilonen"],
                support: ["Bennett", "Xiangling", "Xingqiu", "Fischl", "Sucrose", "Kuki Shinobu", "Diona", "Layla", "Faruzan", "Gorou", "Sara"]
            };

            var manualChar = pickChar(pool.dps);
            var browseChar = pickChar(pool.archon);
            var statsChar = pickChar(pool.support);

            function critcalAvatar(character) {
                var color = elementColor(character.element);
                var avatarHtml = portraitInnerHtml(character);
                return '<span class="crit-avatar" style="--el-color:' + color + '">' + avatarHtml + '</span>';
            }

            container.innerHTML = [
                '<a class="hp-action" href="analyze.html">',
                    critcalAvatar(manualChar),
                    '<span><strong>Manual Analyze</strong><span>Enter your own stats for a rating</span></span>',
                '</a>',
                '<a class="hp-action" href="characters.html">',
                    critcalAvatar(browseChar),
                    '<span><strong>Characters (<span id="char-count-home">' + (data.count || "120+") + '</span>)</strong><span>Browse all builds</span></span>',
                '</a>',
                '<a class="hp-action" href="uid-search.html">',
                    critcalAvatar(statsChar),
                    '<span><strong>UID Search</strong><span>Look up any showcase by UID</span></span>',
                '</a>',
            ].join("");
        })();
    });

    // ── Character Grid ──
    (function () {
        var grid = document.getElementById("home-char-grid");
        var pills = document.querySelectorAll("#home-char-pills .element-pill");
        if (!grid) return;
        var allChars = [], activeEl = "";

        function render() {
            var f = activeEl ? allChars.filter(function (c) { return c.element === activeEl; }) : allChars;
            if (!f.length) { grid.innerHTML = '<div class="home-char-loading">No characters match.</div>'; return; }
            grid.innerHTML = f.slice(0, 24).map(function (c) {
                var color = (c.theme && c.theme.primary) || (function(e) { return { pyro:"#E0785C", hydro:"#5B9BD6", anemo:"#6BC7AE", electro:"#B18FE0", dendro:"#97BE58", cryo:"#83C6DE", geo:"#D6B96C" }[e] || "#5B9BD6"; })(c.element);
                return '<a class="home-char-tile" href="analyze.html?character=' + encodeURIComponent(c.name) + '" style="--el-color:' + color + '">' +
                    '<span class="home-char-tile-avatar" style="--el-color:' + color + '">' + portraitInnerHtml(c) + '</span>' +
                    '<span class="home-char-tile-name">' + escapeHtml(c.name) + '</span></a>';
            }).join("");
        }

        pills.forEach(function (p) {
            p.addEventListener("click", function () {
                pills.forEach(function (x) { x.classList.remove("is-active"); x.setAttribute("aria-pressed", "false"); });
                this.classList.remove("is-active");
                this.classList.add("is-active");
                this.setAttribute("aria-pressed", "true");
                activeEl = this.getAttribute("data-el") || "";
                render();
            });
        });

        cachedFetch(API_BASE + "/characters", "characters").then(function (data) {
            if (data && data.characters) { allChars = data.characters; render(); }
            else { grid.innerHTML = '<div class="home-char-loading">Could not load characters.</div>'; }
        });
    })();
</script>

</body>
</html>
